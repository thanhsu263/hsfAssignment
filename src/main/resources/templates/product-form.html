<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head th:replace="~{fragments/layout :: head(${editing} ? 'Edit product' : 'New product')}"></head>
<body><div th:replace="~{fragments/layout :: navbar('products')}"></div><div th:replace="~{fragments/layout :: flash}"></div>
<main class="container py-4"><div class="row justify-content-center"><div class="col-lg-8"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h2 mb-1" th:text="${editing} ? 'Edit product' : 'New product'">Product</h1><p class="text-body-secondary mb-0">Fields marked required must be completed.</p></div><a th:href="@{/products}" class="btn btn-outline-secondary"><i class="bi bi-arrow-left me-1"></i>Back</a></div>
<div class="card shadow-sm"><div class="card-body p-4"><form th:action="@{/products/save}" th:object="${product}" method="post" class="row g-3" novalidate><input type="hidden" name="editing" th:value="${editing}"><div class="col-md-4"><label class="form-label" for="id">Product ID</label><div th:if="${editing}"><input type="hidden" th:field="*{id}"><p class="form-control-plaintext fw-semibold" th:text="'#' + *{id}">P001</p><div class="form-text">ID cannot change after creation.</div></div><div th:unless="${editing}"><input type="text" class="form-control" value="Auto-generated on save" readonly disabled><div class="form-text">The system assigns the ID automatically.</div></div></div><div class="col-md-8"><label class="form-label" for="name">Name</label><input class="form-control" th:classappend="${#fields.hasErrors('name')} ? 'is-invalid'" th:field="*{name}" id="name" required><div class="invalid-feedback" th:errors="*{name}">Name error</div></div><div class="col-md-4"><label class="form-label" for="quantity">Quantity</label><input class="form-control" th:classappend="${#fields.hasErrors('quantity')} ? 'is-invalid'" th:field="*{quantity}" id="quantity" type="number" min="5" max="100" required><div class="invalid-feedback" th:errors="*{quantity}">Quantity error</div></div><div class="col-md-4"><label class="form-label" for="price">Price (₫)</label><input class="form-control" th:classappend="${#fields.hasErrors('price')} ? 'is-invalid'" th:field="*{price}" id="price" type="number" min="10000" max="100000000" step="1000" required><div class="invalid-feedback" th:errors="*{price}">Price error</div></div><div class="col-md-4"><label class="form-label" for="category">Category</label><select class="form-select" th:field="*{category.id}" id="category"><option value="">No category</option><option th:each="category : ${categories}" th:value="${category.id}" th:text="${category.name}">Category</option></select></div><div class="col-12 d-flex gap-2 pt-2"><button class="btn btn-primary" type="submit"><i class="bi bi-check-lg me-1"></i><span th:text="${editing} ? 'Update product' : 'Create product'">Save</span></button><a th:href="@{/products}" class="btn btn-outline-secondary">Cancel</a></div></form></div></div>
</div></div></main><footer th:replace="~{fragments/layout :: footer}"></footer><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
