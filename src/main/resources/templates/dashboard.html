<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head th:replace="~{fragments/layout :: head('Dashboard')}"></head>
<body><div th:replace="~{fragments/layout :: navbar('dashboard')}"></div><div th:replace="~{fragments/layout :: flash}"></div>
<main class="container py-4"><div class="d-flex justify-content-between align-items-center mb-4"><div><h1 class="h2 mb-1">Dashboard</h1><p class="text-body-secondary mb-0">A quick view of your product inventory.</p></div><a th:if="${currentUser.admin}" th:href="@{/products/new}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>New product</a></div>
<div class="row g-3 mb-4"><div class="col-md-4"><div class="card stat-card shadow-sm h-100"><div class="card-body"><div class="text-body-secondary small text-uppercase">Total products</div><div class="display-6 fw-semibold" th:text="${totalProducts}">0</div></div></div></div><div class="col-md-4"><div class="card stat-card shadow-sm h-100 border-success"><div class="card-body"><div class="text-body-secondary small text-uppercase">Categories</div><div class="display-6 fw-semibold" th:text="${totalCategories}">0</div></div></div></div><div class="col-md-4"><div class="card stat-card shadow-sm h-100 border-warning"><div class="card-body"><div class="text-body-secondary small text-uppercase">Low stock (&lt; 20)</div><div class="display-6 fw-semibold" th:text="${lowStockCount}">0</div></div></div></div></div>
<div class="card shadow-sm"><div class="card-header bg-body d-flex justify-content-between align-items-center"><h2 class="h5 mb-0"><i class="bi bi-exclamation-circle text-warning me-1"></i>Low-stock products</h2><a th:href="@{/products}" class="btn btn-sm btn-outline-primary">View all</a></div><div class="table-responsive"><table class="table table-hover mb-0"><thead><tr><th>ID</th><th>Name</th><th>Category</th><th class="text-end">Quantity</th></tr></thead><tbody><tr th:each="product : ${lowStockProducts}"><td th:text="${product.id}">P001</td><td th:text="${product.name}">Product</td><td th:text="${product.category != null ? product.category.name : '-'}">-</td><td class="text-end"><span class="badge text-bg-warning" th:text="${product.quantity}">15</span></td></tr><tr th:if="${#lists.isEmpty(lowStockProducts)}"><td colspan="4" class="text-center text-body-secondary py-4">Everything is well stocked.</td></tr></tbody></table></div></div>
</main><footer th:replace="~{fragments/layout :: footer}"></footer><th:block th:replace="~{fragments/layout :: scripts}"></th:block></body></html>
