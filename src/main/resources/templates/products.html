<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" data-bs-theme="light">
<head th:replace="~{fragments/layout :: head('Products')}"></head>
<body><div th:replace="~{fragments/layout :: navbar('products')}"></div><div th:replace="~{fragments/layout :: flash}"></div>
<main class="container py-4"><div class="d-flex flex-wrap justify-content-between align-items-center gap-3 mb-4"><div><h1 class="h2 mb-1">Products</h1><p class="text-body-secondary mb-0">Search and manage the inventory.</p></div><a th:if="${currentUser.admin}" th:href="@{/products/new}" class="btn btn-primary"><i class="bi bi-plus-lg me-1"></i>New product</a></div>
<div class="card shadow-sm"><div class="card-body border-bottom"><form th:action="@{/products}" method="get" class="row g-2"><div class="col-md-7 col-lg-5"><div class="input-group"><span class="input-group-text"><i class="bi bi-search"></i></span><input class="form-control" type="search" name="keyword" th:value="${keyword}" placeholder="Search by product ID or name"></div></div><div class="col-auto"><button class="btn btn-outline-primary" type="submit">Search</button><a th:if="${!#strings.isEmpty(keyword)}" th:href="@{/products}" class="btn btn-outline-secondary">Clear</a></div></form></div>
<div class="table-responsive"><table class="table table-striped table-hover mb-0"><thead><tr><th>ID</th><th>Name</th><th>Category</th><th class="text-end">Quantity</th><th class="text-end">Price</th><th th:if="${currentUser.admin}" class="text-end">Actions</th></tr></thead><tbody><tr th:each="product : ${products.content}"><td class="fw-semibold" th:text="${product.id}">P001</td><td th:text="${product.name}">Name</td><td th:text="${product.category != null ? product.category.name : '-'}">-</td><td class="text-end"><span th:if="${product.quantity < 20}" class="badge text-bg-warning" th:text="${product.quantity} + ' low'">15 low</span><span th:unless="${product.quantity < 20}" th:text="${product.quantity}">30</span></td><td class="text-end" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT') + ' ₫'}">10,000 ₫</td><td th:if="${currentUser.admin}" class="text-end text-nowrap"><a th:href="@{/products/edit/{id}(id=${product.id})}" class="btn btn-sm btn-outline-primary"><i class="bi bi-pencil"></i><span class="visually-hidden">Edit</span></a><button type="button" class="btn btn-sm btn-outline-danger" data-bs-toggle="modal" data-bs-target="#deleteModal" th:data-delete-url="@{/products/delete/{id}(id=${product.id})}" th:data-product-name="${product.name}"><i class="bi bi-trash"></i><span class="visually-hidden">Delete</span></button></td></tr><tr th:if="${products.empty}"><td th:colspan="${currentUser.admin ? 6 : 5}" class="text-center text-body-secondary py-5"><i class="bi bi-inbox fs-2 d-block mb-2"></i>No products match your search.</td></tr></tbody></table></div>
<nav th:if="${products.totalPages > 1}" class="p-3" aria-label="Product pages"><ul class="pagination justify-content-center mb-0"><li class="page-item" th:classappend="${products.first} ? 'disabled'"><a class="page-link" th:href="@{/products(page=${products.number - 1},keyword=${keyword})}">Previous</a></li><li th:each="pageNumber : ${#numbers.sequence(0, products.totalPages - 1)}" class="page-item" th:classappend="${pageNumber == products.number} ? 'active'"><a class="page-link" th:href="@{/products(page=${pageNumber},keyword=${keyword})}" th:text="${pageNumber + 1}">1</a></li><li class="page-item" th:classappend="${products.last} ? 'disabled'"><a class="page-link" th:href="@{/products(page=${products.number + 1},keyword=${keyword})}">Next</a></li></ul></nav></div>
</main>
<div th:if="${currentUser.admin}" class="modal fade" id="deleteModal" tabindex="-1" aria-hidden="true"><div class="modal-dialog"><div class="modal-content"><div class="modal-header"><h2 class="modal-title fs-5">Delete product?</h2><button type="button" class="btn-close" data-bs-dismiss="modal"></button></div><div class="modal-body">Delete <strong id="deleteProductName"></strong>? This cannot be undone.</div><div class="modal-footer"><button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button><form id="deleteForm" method="post"><button class="btn btn-danger" type="submit">Delete</button></form></div></div></div></div>
<footer th:replace="~{fragments/layout :: footer}"></footer><th:block th:replace="~{fragments/layout :: scripts}"></th:block><script>document.getElementById('deleteModal')?.addEventListener('show.bs.modal', event => { const button = event.relatedTarget; document.getElementById('deleteForm').action = button.dataset.deleteUrl; document.getElementById('deleteProductName').textContent = button.dataset.productName; });</script></body></html>
