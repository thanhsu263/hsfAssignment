<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head(title)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${title} + ' | CRUD Demo'">CRUD Demo</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
    <link rel="stylesheet" th:href="@{/webjars/bootstrap-icons/1.11.3/font/bootstrap-icons.css}">
    <link rel="stylesheet" th:href="@{/css/app.css}">
    <!-- CDN alternative: <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"> -->
</head>
<body>
<nav th:fragment="navbar(activePage)" class="navbar navbar-expand-lg bg-body-tertiary border-bottom shadow-sm">
    <div class="container">
        <a class="navbar-brand fw-bold text-primary" th:href="@{/dashboard}"><i class="bi bi-boxes me-1"></i> CRUD Demo</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse navbar-collapse" id="mainNav">
            <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'dashboard'} ? 'active'" th:href="@{/dashboard}"><i class="bi bi-speedometer2 me-1"></i>Dashboard</a></li>
                <li class="nav-item"><a class="nav-link" th:classappend="${activePage == 'products'} ? 'active'" th:href="@{/products}"><i class="bi bi-bag me-1"></i>Products</a></li>
            </ul>
            <div class="d-flex align-items-lg-center gap-2">
                <button id="themeToggle" class="btn btn-outline-secondary btn-sm" type="button" title="Toggle dark mode"><i class="bi bi-moon-stars"></i><span class="visually-hidden">Toggle dark mode</span></button>
                <span class="small text-body-secondary" th:text="${currentUser.email}">user@example.com</span>
                <span class="badge" th:classappend="${currentUser.admin} ? 'text-bg-primary' : 'text-bg-secondary'" th:text="${currentUser.roleLabel}">Role</span>
                <form th:action="@{/logout}" method="post"><button class="btn btn-outline-danger btn-sm" type="submit"><i class="bi bi-box-arrow-right me-1"></i>Logout</button></form>
            </div>
        </div>
    </div>
</nav>
<div th:fragment="flash" class="container pt-3">
    <div th:if="${success}" class="alert alert-success alert-dismissible fade show" role="alert"><i class="bi bi-check-circle me-2"></i><span th:text="${success}">Success</span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
    <div th:if="${error}" class="alert alert-danger alert-dismissible fade show" role="alert"><i class="bi bi-exclamation-triangle me-2"></i><span th:text="${error}">Error</span><button type="button" class="btn-close" data-bs-dismiss="alert"></button></div>
</div>
<footer th:fragment="footer" class="border-top mt-auto py-3 text-center text-body-secondary small"><div class="container">CRUD Demo · Spring Boot + Thymeleaf + Bootstrap</div></footer>
<th:block th:fragment="scripts">
    <script th:src="@{/webjars/bootstrap/5.3.3/js/bootstrap.bundle.min.js}"></script>
    <!-- CDN alternative: <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script> -->
    <script>
        (() => {
            const key = 'crud-demo-theme';
            const apply = theme => { document.documentElement.setAttribute('data-bs-theme', theme); localStorage.setItem(key, theme); };
            apply(localStorage.getItem(key) || 'light');
            document.getElementById('themeToggle')?.addEventListener('click', () => apply(document.documentElement.getAttribute('data-bs-theme') === 'dark' ? 'light' : 'dark'));
        })();
    </script>
</th:block>
</body>
</html>
